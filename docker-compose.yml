# Phase 1 scope: infra services are fully wired; application services build
# and expose /health, but most business logic lands in later phases
# (see docs/architecture/README.md for the phase plan). Bring everything
# up with `docker compose up --build`.

services:
  # ---------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tatkal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-tatkal}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - ./infrastructure/postgres/init/01-apply-service-schemas.sql:/docker-entrypoint-initdb.d/01-apply-service-schemas.sql:ro
      - ./src/Services/UserService/Migrations/001_init.sql:/migrations/user/001_init.sql:ro
      - ./src/Services/SearchService/Migrations/001_init.sql:/migrations/search/001_init.sql:ro
      - ./src/Services/BookingService/Migrations/001_init.sql:/migrations/booking/001_init.sql:ro
      - ./src/Services/PaymentService/Migrations/001_init.sql:/migrations/payment/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tatkal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-tatkal}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change_me}
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-change_me}
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # ---------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Redis__ConnectionString: "redis:6379"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-change_me_to_a_long_random_string_at_least_32_chars}"
      Jwt__Issuer: "${JWT_ISSUER:-tatkal-booking-system}"
      Jwt__Audience: "${JWT_AUDIENCE:-tatkal-clients}"
      Otel__OtlpEndpoint: "http://jaeger:4317"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: src/Services/UserService/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=tatkal_user;Username=${POSTGRES_USER:-tatkal};Password=${POSTGRES_PASSWORD:-change_me}"
      Otel__OtlpEndpoint: "http://jaeger:4317"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-change_me_to_a_long_random_string_at_least_32_chars}"
      Jwt__Issuer: "${JWT_ISSUER:-tatkal-booking-system}"
      Jwt__Audience: "${JWT_AUDIENCE:-tatkal-clients}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  search-service:
    build:
      context: .
      dockerfile: src/Services/SearchService/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=tatkal_search;Username=${POSTGRES_USER:-tatkal};Password=${POSTGRES_PASSWORD:-change_me}"
      Redis__ConnectionString: "redis:6379"
      Otel__OtlpEndpoint: "http://jaeger:4317"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-change_me_to_a_long_random_string_at_least_32_chars}"
      Jwt__Issuer: "${JWT_ISSUER:-tatkal-booking-system}"
      Jwt__Audience: "${JWT_AUDIENCE:-tatkal-clients}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  booking-service:
    build:
      context: .
      dockerfile: src/Services/BookingService/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=tatkal_booking;Username=${POSTGRES_USER:-tatkal};Password=${POSTGRES_PASSWORD:-change_me}"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "${RABBITMQ_DEFAULT_USER:-tatkal}"
      RabbitMq__Password: "${RABBITMQ_DEFAULT_PASS:-change_me}"
      Otel__OtlpEndpoint: "http://jaeger:4317"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-change_me_to_a_long_random_string_at_least_32_chars}"
      Jwt__Issuer: "${JWT_ISSUER:-tatkal-booking-system}"
      Jwt__Audience: "${JWT_AUDIENCE:-tatkal-clients}"
      SeatLocking__Strategy: "${SEAT_LOCKING_STRATEGY:-RedisAssisted}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: src/Services/PaymentService/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=tatkal_payment;Username=${POSTGRES_USER:-tatkal};Password=${POSTGRES_PASSWORD:-change_me}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "${RABBITMQ_DEFAULT_USER:-tatkal}"
      RabbitMq__Password: "${RABBITMQ_DEFAULT_PASS:-change_me}"
      Otel__OtlpEndpoint: "http://jaeger:4317"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-change_me_to_a_long_random_string_at_least_32_chars}"
      Jwt__Issuer: "${JWT_ISSUER:-tatkal-booking-system}"
      Jwt__Audience: "${JWT_AUDIENCE:-tatkal-clients}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: src/Services/NotificationService/Dockerfile
    environment:
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "${RABBITMQ_DEFAULT_USER:-tatkal}"
      RabbitMq__Password: "${RABBITMQ_DEFAULT_PASS:-change_me}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  grafana-data:
